<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Gaurav Sharad Bansod, Software Developer</title>
<desc id="d">Animated terminal that boots a developer profile, then reveals the name Gaurav Sharad Bansod, the role Software Developer and the tags Full-Stack, DevOps, Cloud and AI.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1238"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#4f8cff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<linearGradient id="ed" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
</defs>
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.a{animation:in .5s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<rect x="1" y="1" width="718" height="298" rx="14" fill="url(#bg)" stroke="url(#ed)" stroke-opacity=".6" stroke-width="2"/>
<rect x="1" y="1" width="718" height="34" rx="14" fill="#fff" fill-opacity=".05"/>
<circle cx="24" cy="18" r="5" fill="#ec4899"/><circle cx="42" cy="18" r="5" fill="#fb923c"/><circle cx="60" cy="18" r="5" fill="#a3e635"/>
<text x="360" y="23" text-anchor="middle" font-size="13" fill="#7c86a8">gaurav@github:~</text>
<g font-size="16" fill="#c9d1f0">
<text class="a" x="28" y="70" style="animation-delay:.3s"><tspan fill="#a3e635">$</tspan> booting developer.profile...</text>
<text class="a" x="28" y="96" style="animation-delay:1s">&gt; loading projects... <tspan fill="#a3e635">ok</tspan></text>
<text class="a" x="28" y="122" style="animation-delay:1.5s">&gt; loading cloud infrastructure... <tspan fill="#a3e635">ok</tspan></text>
<text class="a" x="28" y="148" style="animation-delay:2s">&gt; loading ai experiments... <tspan fill="#a3e635">ok</tspan></text>
</g>
<g class="a" style="animation-delay:2.4s" font-size="14" font-weight="bold">
<text x="520" y="64" fill="#7c86a8" font-weight="normal">// the loop</text>
<text x="520" y="92" fill="#22d3ee">01 build</text>
<text x="520" y="116" fill="#4f8cff">02 engineer</text>
<text x="520" y="140" fill="#a3e635">03 automate</text>
<text x="520" y="164" fill="#fb923c">04 deploy</text>
<text x="520" y="188" fill="#ec4899">05 improve</text>
</g>
<text class="a" x="28" y="204" font-size="38" font-weight="bold" fill="url(#nm)" style="animation-delay:2.6s">GAURAV SHARAD BANSOD</text>
<text class="a" x="28" y="238" font-size="20" fill="#e6e9ff" style="animation-delay:3.1s">Software Developer</text>
<rect class="cur" x="248" y="222" width="10" height="20" fill="#22d3ee"/>
<g class="a" style="animation-delay:3.5s" font-size="14" text-anchor="middle">
<rect x="28" y="256" width="100" height="26" rx="13" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/><text x="78" y="274" fill="#22d3ee">Full-Stack</text>
<rect x="140" y="256" width="80" height="26" rx="13" fill="#a3e635" fill-opacity=".15" stroke="#a3e635"/><text x="180" y="274" fill="#a3e635">DevOps</text>
<rect x="232" y="256" width="76" height="26" rx="13" fill="#4f8cff" fill-opacity=".15" stroke="#4f8cff"/><text x="270" y="274" fill="#4f8cff">Cloud</text>
<rect x="320" y="256" width="50" height="26" rx="13" fill="#a855f7" fill-opacity=".15" stroke="#a855f7"/><text x="345" y="274" fill="#a855f7">AI</text>
