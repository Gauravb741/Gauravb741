<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 210" role="img" aria-labelledby="title desc">
<title id="title">Engineering lifecycle</title><desc id="desc">Build, automate, deploy and experiment workflow.</desc>
<defs>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
 <filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="210" rx="26" fill="#0B1020" stroke="#26324A"/>
<path d="M190 105H910" stroke="#26324A" stroke-width="6" stroke-linecap="round"/>
<path d="M190 105H910" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 20">
 <animate attributeName="stroke-dashoffset" from="0" to="-76" dur="1.6s" repeatCount="indefinite"/>
</path>
<g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
 <circle cx="160" cy="105" r="50" fill="#082F49" stroke="#22D3EE" stroke-width="3" filter="url(#g)"/>
 <text x="160" y="100" font-size="17" font-weight="800" fill="#67E8F9">BUILD</text><text x="160" y="124" font-size="12" fill="#CBD5E1">apps + APIs</text>
 <circle cx="410" cy="105" r="50" fill="#2E1065" stroke="#A855F7" stroke-width="3" filter="url(#g)"/>
 <text x="410" y="100" font-size="17" font-weight="800" fill="#D8B4FE">AUTOMATE</text><text x="410" y="124" font-size="12" fill="#CBD5E1">CI/CD + tests</text>
 <circle cx="690" cy="105" r="50" fill="#172554" stroke="#60A5FA" stroke-width="3" filter="url(#g)"/>
 <text x="690" y="100" font-size="17" font-weight="800" fill="#93C5FD">DEPLOY</text><text x="690" y="124" font-size="12" fill="#CBD5E1">containers + cloud</text>
 <circle cx="940" cy="105" r="50" fill="#1A2E05" stroke="#A3E635" stroke-width="3" filter="url(#g)"/>
 <text x="940" y="100" font-size="17" font-weight="800" fill="#BEF264">EXPERIMENT</text><text x="940" y="124" font-size="12" fill="#CBD5E1">AI / ML + data</text>
</g>
</svg>
