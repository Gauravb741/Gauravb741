<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" role="img" aria-labelledby="t d">
<title id="t">Engineering focus</title>
<desc id="d">Build, automate, deploy and experiment connected as a simple engineering flow.</desc>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#5ee7ff"/><stop offset=".5" stop-color="#9c7cff"/><stop offset="1" stop-color="#b9ff7a"/></linearGradient>
</defs>
<rect x="10" y="10" width="980" height="130" rx="18" fill="#0d1220" stroke="#2a3550"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
<text x="130" y="52" fill="#5ee7ff" font-size="14" letter-spacing="2">01</text><text x="130" y="80" fill="#eef5ff" font-size="20" font-weight="700">BUILD</text><text x="130" y="105" fill="#9aa8c2" font-size="12">apps & APIs</text>
<text x="370" y="52" fill="#8e9cff" font-size="14" letter-spacing="2">02</text><text x="370" y="80" fill="#eef5ff" font-size="20" font-weight="700">AUTOMATE</text><text x="370" y="105" fill="#9aa8c2" font-size="12">CI/CD & tooling</text>
<text x="630" y="52" fill="#b6ff82" font-size="14" letter-spacing="2">03</text><text x="630" y="80" fill="#eef5ff" font-size="20" font-weight="700">DEPLOY</text><text x="630" y="105" fill="#9aa8c2" font-size="12">cloud & Kubernetes</text>
<text x="870" y="52" fill="#ff9fc3" font-size="14" letter-spacing="2">04</text><text x="870" y="80" fill="#eef5ff" font-size="20" font-weight="700">EXPERIMENT</text><text x="870" y="105" fill="#9aa8c2" font-size="12">AI / ML</text>
</g>
<path d="M190 75h130M430 75h130M690 75h130" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10">
