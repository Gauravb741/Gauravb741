<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">GitOps Kubernetes deployment pipeline</title><desc id="desc">Animated GitHub Actions pipeline through tests, Docker, Trivy, Kubernetes and Argo CD.</desc>
<defs>
 <linearGradient id="pipe" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
 <filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="720" height="430" rx="24" fill="#09111D" stroke="#334155"/>
<text x="30" y="38" font-family="ui-monospace,monospace" font-size="15" fill="#67E8F9">GITOPS // DELIVERY PIPELINE</text>
<path d="M92 90V380M92 120H630M92 190H630M92 260H630M92 330H630" stroke="#253147" stroke-width="2"/>
<g font-family="ui-sans-serif,system-ui,sans-serif">
 <g><rect x="55" y="75" width="180" height="48" rx="13" fill="#082F49" stroke="#22D3EE"/><text x="145" y="105" text-anchor="middle" fill="#A5F3FC" font-weight="800">1. GIT PUSH</text></g>
 <g><rect x="260" y="95" width="190" height="48" rx="13" fill="#1E1B4B" stroke="#818CF8"/><text x="355" y="125" text-anchor="middle" fill="#C7D2FE" font-weight="800">2. GITHUB ACTIONS</text></g>
 <g><rect x="480" y="75" width="180" height="48" rx="13" fill="#0F172A" stroke="#94A3B8"/><text x="570" y="105" text-anchor="middle" fill="#E2E8F0" font-weight="800">3. BUILD + TEST</text></g>
 <g><rect x="55" y="165" width="180" height="48" rx="13" fill="#172554" stroke="#60A5FA"/><text x="145" y="195" text-anchor="middle" fill="#BFDBFE" font-weight="800">4. DOCKER</text></g>
 <g><rect x="260" y="185" width="190" height="48" rx="13" fill="#3B0764" stroke="#C084FC"/><text x="355" y="215" text-anchor="middle" fill="#E9D5FF" font-weight="800">5. TRIVY SCAN</text></g>
 <g><rect x="480" y="165" width="180" height="48" rx="13" fill="#1A2E05" stroke="#A3E635"/><text x="570" y="195" text-anchor="middle" fill="#D9F99D" font-weight="800">6. QUALITY GATE</text></g>
 <g><rect x="55" y="255" width="180" height="48" rx="13" fill="#102A43" stroke="#22D3EE"/><text x="145" y="285" text-anchor="middle" fill="#A5F3FC" font-weight="800">7. KUBERNETES</text></g>
 <g><rect x="260" y="275" width="190" height="48" rx="13" fill="#1E1B4B" stroke="#A78BFA"/><text x="355" y="305" text-anchor="middle" fill="#DDD6FE" font-weight="800">8. ARGO CD</text></g>
 <g><rect x="480" y="255" width="180" height="48" rx="13" fill="#073047" stroke="#38BDF8"/><text x="570" y="285" text-anchor="middle" fill="#BAE6FD" font-weight="800">9. GITOPS SYNC</text></g>
 <g><rect x="200" y="345" width="320" height="48" rx="13" fill="#052E16" stroke="#4ADE80" filter="url(#g)"/><text x="360" y="375" text-anchor="middle" fill="#BBF7D0" font-weight="800">✓ ROLLING DEPLOYMENT</text></g>
</g>
<path d="M238 99H260M450 119H480M238 189H260M450 209H480M238 279H260M450 299H480" stroke="url(#pipe)" stroke-width="4" stroke-dasharray="11 9">
<animate attributeName="stroke-dashoffset" from="0" to="-60" dur="1.25s" repeatCount="indefinite"/>
</path>
</svg>
