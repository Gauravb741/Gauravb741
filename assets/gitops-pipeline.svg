<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 190" role="img" aria-labelledby="t d">
<title id="t">GitOps deployment pipeline</title>
<desc id="d">Git push to GitHub Actions, Docker, Trivy, Kubernetes and Argo CD.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#5ee7ff"/><stop offset=".5" stop-color="#8d84ff"/><stop offset="1" stop-color="#baff7c"/></linearGradient></defs>
<rect x="8" y="8" width="1034" height="174" rx="16" fill="#0b1220" stroke="#2b3854"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
<g fill="#dfeaff">
<text x="105" y="74" font-size="15" font-weight="700">GIT PUSH</text>
<text x="260" y="74" font-size="15" font-weight="700">ACTIONS</text>
<text x="415" y="74" font-size="15" font-weight="700">DOCKER</text>
<text x="570" y="74" font-size="15" font-weight="700">TRIVY</text>
<text x="735" y="74" font-size="15" font-weight="700">K8S</text>
