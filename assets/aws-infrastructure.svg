<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 430" role="img" aria-labelledby="title desc">
<title id="title">Terraform AWS infrastructure</title><desc id="desc">Terraform provisioning AWS networking, compute, storage, IAM and security groups.</desc>
<defs><linearGradient id="t" x1="0" x2="1"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#60A5FA"/></linearGradient></defs>
<rect width="650" height="430" rx="24" fill="#0B111B" stroke="#334155"/>
<text x="28" y="36" font-family="ui-monospace,monospace" font-size="15" fill="#FCD34D">TERRAFORM // AWS INFRA</text>
<g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
 <rect x="216" y="60" width="218" height="58" rx="15" fill="#2A1806" stroke="#F59E0B" stroke-width="2"/><text x="325" y="96" fill="#FCD34D" font-size="18" font-weight="800">TERRAFORM</text>
 <path d="M325 118V157" stroke="url(#t)" stroke-width="4" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="0" to="-50" dur="1s" repeatCount="indefinite"/></path>
 <rect x="38" y="158" width="574" height="218" rx="22" fill="#0F172A" stroke="#1E293B"/>
 <text x="325" y="186" fill="#93C5FD" font-size="16" font-weight="800">AWS</text>
 <rect x="62" y="205" width="155" height="62" rx="14" fill="#082F49" stroke="#38BDF8"/><text x="140" y="232" fill="#BAE6FD" font-weight="800">VPC</text><text x="140" y="252" fill="#CBD5E1" font-size="11">networking</text>
 <rect x="247" y="205" width="155" height="62" rx="14" fill="#172554" stroke="#818CF8"/><text x="325" y="232" fill="#C7D2FE" font-weight="800">EC2</text><text x="325" y="252" fill="#CBD5E1" font-size="11">auto scaling</text>
 <rect x="432" y="205" width="155" height="62" rx="14" fill="#1A2E05" stroke="#A3E635"/><text x="510" y="232" fill="#D9F99D" font-weight="800">S3</text><text x="510" y="252" fill="#CBD5E1" font-size="11">storage</text>
 <rect x="112" y="294" width="190" height="58" rx="14" fill="#2E1065" stroke="#C084FC"/><text x="207" y="328" fill="#E9D5FF" font-weight="800">IAM</text>
 <rect x="348" y="294" width="190" height="58" rx="14" fill="#3F1D04" stroke="#FB923C"/><text x="443" y="328" fill="#FED7AA" font-weight="800">SECURITY GROUPS</text>
</g>
<text x="325" y="402" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#94A3B8">plan → validate → apply → destroy</text>
