<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Gaurav Sharad Bansod — Software Developer</title>
<desc id="desc">A futuristic animated terminal-style developer profile banner.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#090A16"/>
    <stop offset="0.5" stop-color="#10102A"/>
    <stop offset="1" stop-color="#071820"/>
  </linearGradient>
  <linearGradient id="titleG" x1="0" x2="1">
    <stop offset="0" stop-color="#67E8F9"/>
    <stop offset="0.42" stop-color="#A78BFA"/>
    <stop offset="0.7" stop-color="#F472B6"/>
    <stop offset="1" stop-color="#A3E635"/>
  </linearGradient>
  <filter id="glowC"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8B5CF6" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="430" rx="30" fill="url(#bg)"/>
<rect width="1200" height="430" rx="30" fill="url(#grid)"/>
<circle cx="1060" cy="30" r="150" fill="#06B6D4" opacity=".10" filter="url(#soft)">
  <animate attributeName="r" values="135;170;135" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="118" cy="378" r="140" fill="#A855F7" opacity=".10" filter="url(#soft)">
  <animate attributeName="r" values="120;155;120" dur="6s" repeatCount="indefinite"/>
</circle>
<rect x="54" y="42" width="1092" height="346" rx="22" fill="#090D18" fill-opacity=".82" stroke="#334155" stroke-opacity=".55"/>
<circle cx="82" cy="70" r="7" fill="#F43F5E"/><circle cx="105" cy="70" r="7" fill="#F59E0B"/><circle cx="128" cy="70" r="7" fill="#84CC16"/>
<text x="160" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#64748B">gaurav@github — profile.sh</text>
<text x="88" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#22D3EE">$ booting developer.profile</text>
<text x="88" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#94A3B8">[✓] applications   [✓] automation   [✓] cloud   [✓] ai/ml</text>
<text x="88" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="800" fill="url(#titleG)">GAURAV SHARAD BANSOD</text>
<text x="90" y="253" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#E2E8F0">Software Developer</text>
<text x="90" y="289" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#67E8F9">FULL-STACK</text>
<text x="226" y="289" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C084FC">• DEVOPS / CLOUD</text>
<text x="445" y="289" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#F9A8D4">• AI / ML</text>
<text x="90" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#94A3B8">BUILD → AUTOMATE → DEPLOY → EXPERIMENT</text>
<rect x="90" y="350" width="7" height="20" fill="#67E8F9">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
<text x="110" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#CBD5E1">$ cat /home/gaurav/next-project</text>
<g filter="url(#glowC)">
  <circle cx="1016" cy="194" r="8" fill="#A3E635"><animate attributeName="cy" values="194;168;194" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1062" cy="220" r="5" fill="#67E8F9"><animate attributeName="cy" values="220;248;220" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="1089" cy="170" r="6" fill="#F472B6"><animate attributeName="cy" values="170;198;170" dur="2.5s" repeatCount="indefinite"/></circle>
</g>
</svg>
