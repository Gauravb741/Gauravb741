<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Terraform AWS infrastructure</title>
<desc id="d">Terraform runs a plan, validate, apply, destroy lifecycle and provisions an AWS environment made of VPC, EC2 auto scaling groups, S3, IAM roles and policies, and security groups.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c86a8"/></marker></defs>
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.h{font-size:16px;font-weight:bold}.s{font-size:13px;fill:#c9d1f0}
</style>
<rect x="1" y="1" width="718" height="310" rx="14" fill="#0b1020" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
<rect x="250" y="18" width="220" height="56" rx="12" fill="#a3e635" fill-opacity=".12" stroke="#a3e635" stroke-width="2"/>
<text x="360" y="42" text-anchor="middle" class="h" fill="#a3e635" font-size="18">Terraform · IaC</text>
<text x="360" y="62" text-anchor="middle" class="s">modular · reproducible</text>
<text x="360" y="98" text-anchor="middle" font-size="16" fill="#22d3ee">plan → validate → apply → destroy</text>
<line x1="360" y1="106" x2="360" y2="138" stroke="#7c86a8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" values="0;-8" dur="1s" repeatCount="indefinite"/></line>
<rect x="30" y="142" width="660" height="138" rx="14" fill="#4f8cff" fill-opacity=".06" stroke="#4f8cff" stroke-width="2" stroke-dasharray="6 4"/>
<text x="46" y="166" class="h" fill="#4f8cff" font-size="17">AWS</text>
<g>
<rect x="41" y="184" width="118" height="80" rx="10" fill="#4f8cff" fill-opacity=".14" stroke="#4f8cff" stroke-width="2"/><text x="100" y="218" text-anchor="middle" class="h" fill="#4f8cff">VPC</text><text x="100" y="240" text-anchor="middle" class="s">network</text>
<rect x="171" y="184" width="118" height="80" rx="10" fill="#4f8cff" fill-opacity=".14" stroke="#4f8cff" stroke-width="2"/><text x="230" y="218" text-anchor="middle" class="h" fill="#4f8cff">EC2</text><text x="230" y="240" text-anchor="middle" class="s">auto scaling</text>
<rect x="301" y="184" width="118" height="80" rx="10" fill="#4f8cff" fill-opacity=".14" stroke="#4f8cff" stroke-width="2"/><text x="360" y="218" text-anchor="middle" class="h" fill="#4f8cff">S3</text><text x="360" y="240" text-anchor="middle" class="s">storage</text>
<rect x="431" y="184" width="118" height="80" rx="10" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-width="2"/><text x="490" y="218" text-anchor="middle" class="h" fill="#fb923c">IAM</text><text x="490" y="240" text-anchor="middle" class="s">roles/policies</text>
<rect x="561" y="184" width="118" height="80" rx="10" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-width="2"/><text x="620" y="218" text-anchor="middle" class="h" fill="#fb923c">Security</text><text x="620" y="240" text-anchor="middle" class="s">groups</text>
</g>
<text x="360" y="302" text-anchor="middle" font-size="13" fill="#c9d1f0">least-privilege IAM · standardized network access controls</text>
</svg>
