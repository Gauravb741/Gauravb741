<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">GitOps Kubernetes Deployer pipeline</title>
<desc id="d">Git push, build, unit tests and Docker image in GitHub Actions, then a Trivy scan as quality gate, Argo CD GitOps sync, Kubernetes, with self-healing and automated rollback on failed health checks.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c86a8"/></marker></defs>
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.h{font-size:17px;font-weight:bold}.s{font-size:13px;fill:#c9d1f0}.n{font-size:12px;font-weight:bold;fill:#0b1020}
</style>
<rect x="1" y="1" width="718" height="268" rx="14" fill="#0b1020" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
<g stroke="#7c86a8" stroke-width="2" marker-end="url(#ah)" fill="none">
<line x1="166" y1="74" x2="200" y2="74"/><line x1="342" y1="74" x2="376" y2="74"/><line x1="518" y1="74" x2="552" y2="74"/>
<line x1="624" y1="104" x2="624" y2="148"/>
<line x1="552" y1="180" x2="522" y2="180"/><line x1="376" y1="180" x2="346" y2="180"/><line x1="200" y1="180" x2="170" y2="180"/>
</g>
<g>
<rect x="26" y="44" width="140" height="60" rx="10" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="2"/><text class="h" x="40" y="70" fill="#22d3ee">Git push</text><text class="s" x="40" y="91">Git</text>
<rect x="202" y="44" width="140" height="60" rx="10" fill="#a3e635" fill-opacity=".12" stroke="#a3e635" stroke-width="2"/><text class="h" x="216" y="70" fill="#a3e635">Build</text><text class="s" x="216" y="91">GitHub Actions</text>
<rect x="378" y="44" width="140" height="60" rx="10" fill="#a3e635" fill-opacity=".12" stroke="#a3e635" stroke-width="2"/><text class="h" x="392" y="70" fill="#a3e635">Unit tests</text><text class="s" x="392" y="91">GitHub Actions</text>
<rect x="554" y="44" width="140" height="60" rx="10" fill="#a3e635" fill-opacity=".12" stroke="#a3e635" stroke-width="2"/><text class="h" x="568" y="70" fill="#a3e635">Docker image</text><text class="s" x="568" y="91">Docker</text>
<rect x="554" y="150" width="140" height="60" rx="10" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-width="2"/><text class="h" x="568" y="176" fill="#fb923c">Trivy scan</text><text class="s" x="568" y="197">quality gate</text>
<rect x="378" y="150" width="140" height="60" rx="10" fill="#a3e635" fill-opacity=".12" stroke="#a3e635" stroke-width="2"/><text class="h" x="392" y="176" fill="#a3e635">Argo CD</text><text class="s" x="392" y="197">GitOps sync</text>
<rect x="202" y="150" width="140" height="60" rx="10" fill="#4f8cff" fill-opacity=".14" stroke="#4f8cff" stroke-width="2"/><text class="h" x="216" y="176" fill="#4f8cff">Kubernetes</text><text class="s" x="216" y="197">rolling updates</text>
<rect x="26" y="150" width="140" height="60" rx="10" fill="none" stroke="#4f8cff" stroke-width="2" stroke-dasharray="5 4"/><text class="h" x="40" y="176" fill="#4f8cff">Self-heal</text><text class="s" x="40" y="197">auto rollback</text>
</g>
<g fill="#22d3ee"><circle cx="36" cy="44" r="9"/><circle cx="212" cy="44" r="9"/><circle cx="388" cy="44" r="9"/><circle cx="564" cy="44" r="9"/><circle cx="564" cy="150" r="9"/><circle cx="388" cy="150" r="9"/><circle cx="212" cy="150" r="9"/></g>
