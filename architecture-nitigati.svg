<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">NITIGATI architecture</title>
<desc id="d">Next.js 16 frontend talks over REST and WebSockets to Daphne ASGI running Django REST Framework and Django Channels, backed by Redis channel layers. An AI voice onboarding loop uses faster-Whisper, Gemini 2.0 Flash and Edge TTS until all profile fields are captured.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c86a8"/></marker></defs>
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.h{font-size:16px;font-weight:bold}.s{font-size:13px;fill:#c9d1f0}
.f{stroke:#7c86a8;stroke-width:2;fill:none;stroke-dasharray:4 4;animation:d 1s linear infinite}
@keyframes d{to{stroke-dashoffset:-8}}
</style>
<rect x="1" y="1" width="718" height="418" rx="14" fill="#0b1020" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
<rect x="30" y="20" width="660" height="56" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="2"/>
<text x="50" y="45" class="h" fill="#22d3ee" font-size="18">Next.js 16 · TypeScript · Tailwind CSS v4</text><text x="50" y="65" class="s">Provider / Customer interface</text>
<line class="f" x1="360" y1="78" x2="360" y2="98" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="374" y="92" font-size="13" fill="#7c86a8">REST · WebSocket</text>
<rect x="30" y="102" width="660" height="102" rx="14" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 4" stroke-opacity=".7"/>
<text x="44" y="120" font-size="13" fill="#7c86a8">Daphne · ASGI</text>
<rect x="44" y="128" width="300" height="64" rx="10" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="2"/><text x="60" y="152" class="h" fill="#22d3ee">Django REST Framework</text><text x="60" y="174" class="s">token auth · orders · proposals</text>
<rect x="364" y="128" width="312" height="64" rx="10" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="2"/><text x="380" y="152" class="h" fill="#22d3ee">Django Channels</text><text x="380" y="174" class="s">WebSockets · Provider–Customer chat</text>
<line class="f" x1="520" y1="204" x2="520" y2="224" marker-end="url(#ah)"/>
<rect x="364" y="226" width="312" height="42" rx="10" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-width="2"/><text x="380" y="253" class="h" fill="#fb923c">Redis · channel layers</text>
<text x="30" y="298" class="h" fill="#a855f7">AI voice onboarding</text><text x="222" y="298" class="s">runs over the WebSocket</text>
<rect x="30" y="308" width="190" height="56" rx="10" fill="#a855f7" fill-opacity=".14" stroke="#a855f7" stroke-width="2"/><text x="46" y="332" class="h" fill="#a855f7">faster-Whisper</text><text x="46" y="352" class="s">speech → text</text>
<rect x="265" y="308" width="190" height="56" rx="10" fill="#a855f7" fill-opacity=".14" stroke="#a855f7" stroke-width="2"/><text x="281" y="332" class="h" fill="#a855f7">Gemini 2.0 Flash</text><text x="281" y="352" class="s">extracts profile fields</text>
<rect x="500" y="308" width="190" height="56" rx="10" fill="#a855f7" fill-opacity=".14" stroke="#a855f7" stroke-width="2"/><text x="516" y="332" class="h" fill="#a855f7">Edge TTS</text><text x="516" y="352" class="s">asks follow-ups</text>
<line class="f" x1="222" y1="336" x2="263" y2="336" marker-end="url(#ah)"/><line class="f" x1="457" y1="336" x2="498" y2="336" marker-end="url(#ah)"/>
<path class="f" d="M595,366 C595,402 125,402 125,366" marker-end="url(#ah)"/>
<text x="360" y="414" text-anchor="middle" font-size="13" fill="#c9d1f0">repeat until all fields are captured</text>
</svg>
